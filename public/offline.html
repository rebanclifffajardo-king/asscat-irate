<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#28a745" />
  <title>Offline · ASSCAT iRATE</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px;
      font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif; background: #f4f6f9; color: #343a40; }
    .card { width: 100%; max-width: 420px; background: #fff; border-top: 3px solid #28a745; border-radius: 6px;
      box-shadow: 0 0 1px rgba(0,0,0,.125), 0 1px 3px rgba(0,0,0,.2); padding: 32px 24px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { margin: 0; color: #6c757d; font-size: 15px; line-height: 1.5; }
    button { margin-top: 20px; border: 0; border-radius: 6px; background: #28a745; color: #fff; font: inherit; font-weight: 600;
      padding: 10px 18px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>ASSCAT iRATE needs an internet connection. Check your connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
